<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PlayControl</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="header">
    <span class="logo">&#9654;</span>
    <span class="name">PlayControl</span>
  </div>

  <div id="status" class="status">
    <div id="title" class="title">No YouTube video in this tab</div>
    <div id="meta" class="meta"></div>
  </div>

  <div class="actions">
    <button id="open-manager" class="btn primary">Bookmark manager</button>
    <button id="open-options" class="btn">Settings</button>
  </div>

  <div class="hint" id="hint"></div>

  <script src="../src/defaults.js"></script>
  <script src="../src/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
